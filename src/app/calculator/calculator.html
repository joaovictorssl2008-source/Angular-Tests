<div class ='calculator'>
    <div class='container'>
        <div class='form-box'>
            <form frm="ngForm">
                <h2>Calculator</h2>
                <label for="number1">Number 1:</label>
                <input type="number" id="number1" [(ngModel)]="number1" name="number1"/>

                <label for="number2">Number 2:</label>
                <input type="number" name="number2" id="number2" [(ngModel)]="number2"/>

                <button type="button" (click)="calculateResult()">Subtract</button>

                <button type="button" (click)="calculateResult2()">Add</button>

                <button type="button" (click)="calculateResult3()">Multiply</button>

                <div class="result-display">
                    <p>Result:<span id="result">{{result}}</span></p>
                    
                </div>
                
            </form>
        </div>
</div>
