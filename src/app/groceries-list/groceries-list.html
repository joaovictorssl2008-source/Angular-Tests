<div class="container">
    <h1>Groceries List</h1>
    <form #frm="ngForm" class="add-item-form" (ngSubmit)="addItem()">
        <input type="text"
            name="item"
            id="item" [(ngModel)]="item" placeholder="Add an item"/>
            <button type="submit">Add</button>
    </form>

    <table>
        <thead>
            <tr>
                <th>#</th>
                <th>Item</th>
                <th></th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>1</td>
                <td>Rice</td>
                <td><input type="checkbox" /></td>
            </tr>
            <tr>
                <td>2</td>
                <td>Beans</td>
                <td><input type="checkbox" /></td>
            </tr>
        </tbody>
    </table>
