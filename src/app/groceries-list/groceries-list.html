<div class="container">
    <h1>Groceries List</h1>
    <form #frm="ngForm" class="add-item-form" (ngSubmit)="addItem()">
        <input type="text"
            name="item"
            id="item"+ 1 [(ngModel)]="item" placeholder="Add an item"/>
            <button type="submit">Add</button>
    </form>

    <table>
        <thead>
            <tr>
                <th>#</th>
                <th>Item</th>
                <th></th>
            </tr>
        </thead>
        <tbody>
            @for (element of list; track element.id) {
                <tr>
                    <td>{{element.id}}</td>
                    <td>{{element.name}}</td>
                    <td><input type="checkbox"/></td>
                </tr>
            }
            @empty {
            <tr colspan="3">
                No item added!
            </tr>
            }
        
        </tbody>
    </table>
